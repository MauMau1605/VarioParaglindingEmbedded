# ─── Core & C++ ───
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_MINIMAL_LIBC=y
CONFIG_SIZE_OPTIMIZATIONS=y
# BT host/settings need a small heap; raise if bt_enable() returns -ENOMEM
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ─── Logging: RTT over SWD (no UART console: no free UART pins) ───
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ─── Peripherals ───
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
# Interrupt-driven UART with ring buffer (not async API)
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y

CONFIG_PWM=y
CONFIG_PWM_NRFX=y

CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# ─── Watchdog (board has no reset button) ───
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# ─── Flash & persistent settings ───
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ─── Bluetooth LE ───
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="VarioGPS"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_SETTINGS=n

# ─── Clocks ───
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
