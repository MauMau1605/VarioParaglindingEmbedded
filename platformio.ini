; VarioUSB — PlatformIO Configuration
; Target: Seeed XIAO SAMD21 (ATSAMD21G18A)
; Variometer USB with BMP390 pressure sensor

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200

build_flags =
    -fno-exceptions
    -fno-rtti
    -std=gnu++17

build_src_flags =
    -Wall
    -Wextra
    -Werror

build_src_filter = +<*> -<../test/>
